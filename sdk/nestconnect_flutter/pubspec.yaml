name: nestconnect_flutter
description: Nest Connect live chat inside your Flutter app — a launcher, a messenger, and the channel's own branding.
version: 0.6.3
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  nestconnect_client:
    path: ../nestconnect_client
  # Voice notes, and the two plugins they cannot be built without.
  #
  # This is the one place the no-plugin rule below is broken, and knowingly:
  # Flutter cannot record or play audio without native code, so a voice note
  # means a plugin wherever it lives. Leaving it to the host app would mean
  # every app that wants the feature choosing and wiring its own recorder,
  # which is a worse trade than the one made here.
  #
  # What it costs, said plainly: an app that takes this package inherits a
  # microphone permission in its store listing whether or not it turns voice
  # notes on. `record` asks for the permission only when recording actually
  # starts, so nobody is prompted by a chat they merely opened.
  record: ^5.1.2
  just_audio: ^0.9.42
  # The home screen's cards are the business's other ways of being reached — a
  # help centre, a WhatsApp number, an email address — so tapping one has to
  # leave the app. Bundled rather than left to the host for the same reason as
  # the two above: there is no way to open a URL from Flutter without native
  # code, so it is a plugin wherever it lives. This one asks for no permission
  # and adds nothing to a store listing.
  url_launcher: ^6.3.0

# No other plugins, deliberately.
#
# A plugin means native build configuration, a permissions prompt, and a
# platform channel — for every app that takes this, whether or not it uses the
# feature. Picking a photo is the one thing that would otherwise need one, and
# the host app already has a picker and already has the permission: it hands
# us bytes.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
