<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the mobile browser's top/bottom chrome to match the app surface
         (kept in sync with the theme by syncThemeColor()). -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Cut from the brand artwork: a 32 for the tab, a 64 for denser
         displays, a 192 for Android's tab grid and home screen, and a 180 for an
         iOS home screen (the white mark on its green tile, as iOS composites
         onto white). /favicon.ico and /apple-touch-icon.png sit at the root too,
         for the browsers and phones that ask for those names regardless. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/brand/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/favicon-180.png" />
    <title>NestConnect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
