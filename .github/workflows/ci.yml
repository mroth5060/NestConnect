name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # A real Postgres, for the tenant-isolation checks below. Only those steps
    # are pointed at it (DATABASE_URL is set per step): every other check runs
    # on the in-memory store, as it always has.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from the "packageManager"
      # field in package.json. Pinning it in both places makes the action abort
      # with ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Workspaces can't see, change or link to each other's data. Enforced in
      # one place — the tenant-scoped Prisma client — and so only provable
      # against Postgres: the in-memory store is single-workspace by design.
      # The store is attacked directly first, then through the running API
      # (auth guard, controllers, webhooks, the chat widget, the socket).
      - name: Tenant isolation (store, Postgres)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nest_ci
        run: |
          pnpm --filter @ding/api exec prisma migrate deploy
          pnpm check:tenant-isolation
          pnpm check:organisations-pg
          pnpm check:macros-pg
          pnpm check:email-signature-pg
          pnpm check:business-ops-pg
          pnpm check:team-chat-pg
          pnpm check:coexistence-pg

      - name: Tenant isolation (HTTP, Postgres)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nest_ci
          NODE_ENV: development
          AUTH_REQUIRE_2FA: "false"
          GMAIL_POLL_SECONDS: "0"
          PORT: "3011"
        run: |
          node apps/api/dist/main.js > /tmp/api-tenancy.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3011/health >/dev/null && break; sleep 1; done
          TENANT_HTTP_URL=http://localhost:3011 pnpm check:tenant-http
          TENANT_HTTP_URL=http://localhost:3011 pnpm check:workspaces-http
          TENANT_HTTP_URL=http://localhost:3011 pnpm check:workspace-lifecycle-http
          # A request that reached the store without its workspace bound fails
          # closed with one of these; any in the log is a path that forgot.
          if grep -E "TenantNotBound|TenantConflict" /tmp/api-tenancy.log; then
            echo "::error::a request ran without its workspace bound"; exit 1
          fi

      # The app-store reviewer's demo workspace (docs/play-reviewer-access.md).
      # A stranger signs in to the real app with it, so what is pinned is what
      # it must never become: a window onto a real workspace, or a way to
      # message a real person. Run against an API that *requires* two-factor,
      # as production does — the demo login is the one exemption, and the
      # check proves a real workspace's account is still stopped.
      - name: Reviewer demo workspace (Postgres, 2FA required)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nest_ci
          NODE_ENV: development
          GMAIL_POLL_SECONDS: "0"
          PORT: "3012"
        run: |
          node apps/api/dist/main.js > /tmp/api-reviewer.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3012/health >/dev/null && break; sleep 1; done
          REVIEWER_HTTP_URL=http://localhost:3012 pnpm check:reviewer-workspace
          if grep -E "TenantNotBound|TenantConflict" /tmp/api-reviewer.log; then
            echo "::error::a request ran without its workspace bound"; exit 1
          fi

      # Where an inbound message lands. This shipped wrong — a reply to a snoozed
      # chat opened a second conversation with the same customer — and nothing
      # else here would have noticed: it typechecks, it builds, no request fails,
      # and the duplicate looks like a customer starting a new conversation.
      - name: Inbound threading rule
        run: pnpm check:threading

      # Which team a new conversation lands on. Sibling to the rule above and
      # failing the same way: a chat routed to the wrong people looks completely
      # normal — it typechecks, it builds, nothing errors — it is simply sitting
      # in front of a team that isn't going to answer it, while the customer
      # waits. The check has existed since the routing menu shipped and was only
      # ever run by hand, which protects nobody.
      - name: Routing rule
        run: pnpm check:routing

      # A conversation an agent starts stays theirs: Compose takes a queued
      # thread, and an answer to a resolved outreach goes back to the agent
      # who wrote rather than into the queue.
      - name: Agent outreach comes back to the agent
        run: pnpm check:outreach

      # A channel can tag every customer and label every conversation that
      # starts on it — once, at the start, so taking either off by hand sticks.
      - name: Channel tags and labels new conversations
        run: pnpm check:arrival-tags

      # An agent's sidebar offers only their teams and the channels routed to
      # them; the lists themselves hold to the same rule, so a link can't get
      # round it. Admins and managers see everything.
      - name: Agents open only their own teams and channels
        run: pnpm check:channel-access

      # An email with Reply-To someone else (a website form) is the Reply-To's:
      # the contact, the thread and the reply all go to them.
      - name: Email Reply-To decides who the customer is
        run: pnpm check:reply-to

      # Forwarding an email takes its attachments, as copies (the original keeps its own).
      - name: Forwarded email carries its attachments
        run: pnpm check:email-forward

      # The WhatsApp verified badge (Official Business Account): status read and
      # application sent the way Meta's API expects, against a stand-in for Meta.
      - name: WhatsApp Official Business Account status and request
        run: pnpm check:oba

      # A WhatsApp number that stays on the WhatsApp Business app (coexistence):
      # connect without registering, phone replies, history in date order,
      # contacts, and Meta unlinking it — against simulated Meta events.
      - name: WhatsApp Business app numbers (coexistence)
        run: pnpm check:coexistence

      # Registering a WhatsApp number on the Cloud API. Fails silently in the
      # worst way available: a number Meta has left at PENDING has perfectly
      # good credentials saved, so it reads as "Connected" everywhere in the app
      # and cannot send a single message. The check also holds the line on not
      # spending one of Meta's few PIN guesses on a number that is already
      # registered — get that wrong and a retry loop locks the number out for a
      # day.
      - name: WhatsApp registration
        run: pnpm check:whatsapp-register

      # What a failed WhatsApp message tells the agent reading the thread. Meta
      # says exactly why it gave up — a billing setting, a closed reply window —
      # and that answer used to reach the log and nowhere else, leaving the
      # thread to say "Not delivered" about something fixable in a minute. A
      # wrong reason is worse than none, because somebody acts on it.
      - name: WhatsApp delivery reasons
        run: pnpm check:whatsapp-delivery

      # Which templates a WhatsApp number may send. Templates belong to an
      # account, not a number, and offering another account's is offering a send
      # Meta rejects with 132001 — after the message is queued, so it reads as a
      # broken template rather than the wrong number. The old behaviour (one
      # merged list from whichever account got synced last) typechecked, built,
      # and looked like a feature.
      - name: Template account scope
        run: pnpm check:template-scope

      # Templates kept in step with Meta, per account: a new one is submitted
      # for approval on its account, a delete reaches Meta, the wording of an
      # approved one isn't edited here, accounts sync by themselves, and a
      # template linked to no account isn't sent from a number that has one.
      - name: Templates and Meta
        run: pnpm check:template-meta

      # Internal notes: an answer to your note reaches you even without an @ —
      # everyone already in the conversation's notes is told, never the author,
      # never twice.
      - name: Note replies
        run: pnpm check:note-replies

      # A note puts someone else's conversation in the inbound of everyone it's
      # for, until they answer, dismiss it, or it closes.
      - name: Note follow-ups
        run: pnpm check:note-follow-ups
      - name: Member invites
        run: pnpm check:member-invites

      # Who hears about a new message. The web used to chime for every arrival
      # anywhere in the workspace, because the sound hung off a broadcast meant
      # for keeping lists current. Both ways of getting the fix wrong are silent:
      # reading the policy through the push path makes "never installed the app"
      # mean "wants no alerts", and an inbox with no team routes to nobody at all.
      - name: Alert policy
        run: pnpm check:alert-policy

      # A chat routed to a team is heard by that team: a transfer rings the
      # team's bell, phone and screen; a new chat waiting unassigned rings them
      # as a new chat — under "new chats for my team", on by default.
      - name: Team alerts
        run: pnpm check:team-alerts

      # Which number, or which address, an outbound message goes out from. A
      # cross-channel reply sends from the channel's inbox, which used to be
      # whichever row an unordered query returned first — with two numbers that
      # is a coin toss the customer sees and nobody can explain afterwards,
      # because the inbox was resolved at delivery and then thrown away.
      - name: Outbound sending inbox
        run: pnpm check:outbound-inbox

      # Which template re-opens a chat once its 24-hour window has closed. It is
      # sent by nobody — the agent types normally and their text becomes its
      # {{1}} — so a wrong pick is wrong silently, in front of a customer. The
      # choice used to be keyed to the WhatsApp account, and several numbers
      # routinely share one, so a sales line and a support line had a single
      # setting between them: changing one changed the other.
      - name: Per-number default template
        run: pnpm check:default-template

      # Facts a workspace records that we did not think of — an order number, a
      # booking reference — and, the part that actually matters, finding them
      # again. The value is written once by an integration and then read out
      # over the phone by a customer, so what is being protected is an agent
      # typing what they hear and landing on the right thread. Every way that
      # fails is quiet: the value is there, the search says nothing, and the
      # agent concludes the order does not exist.
      - name: Custom fields and reference search
        run: pnpm check:custom-fields

      # Subjects Nest writes for WhatsApp and website-chat threads: custom field
      # values in front (put there by Nest, never left to a prompt), then an AI
      # topic from the customer's first few messages. Pins that email and older
      # threads are never touched, and that a demo workspace or the switch in
      # Settings keeps customer text from being sent anywhere.
      - name: Conversation subjects
        run: pnpm check:conversation-subjects

      # Who is here. Working hours read in each person's own zone (night shifts
      # included); round-robin and a customer's own person respect them; the
      # website chat is online only while somebody who answers it is available;
      # and a visitor who left gets an unseen reply by email — once, and never
      # if they read it, answered, gave no address or the channel said no.
      - name: Availability, working hours and visitor email
        run: pnpm check:availability

      # Moving from Gmail: only email conversations are deleted, and an unread
      # thread comes in once, whole, at the times it was really written.
      - name: Move from Gmail (email cutover)
        run: pnpm check:email-cutover

      # Organisations: the acceptance scenarios (a new customer, linked
      # contacts, an incoming message, a handover, a contact at two companies,
      # updated instructions) and who may change what.
      - name: Organisations and customer knowledge
        run: pnpm check:organisations

      # Macros: who may write them, and which a conversation is offered — its
      # team inbox's (the assigned team, or its channel's teams before anyone
      # has it) plus the ones every team gets.
      # Organisation routing: its people's new chats go to its team (and person),
      # under a contact's own routing and above the channel's; never a guess
      # between two organisations.
      - name: Organisation routing
        run: pnpm check:org-routing

      # The conversation log: arrival and routing (and why), assignment, status,
      # priority, labels, organisation, fields and failures, each as a sentence.
      - name: Conversation log
        run: pnpm check:conversation-log

      - name: Macros
        run: pnpm check:macros

      # A Gmail mailbox Google signs out: flagged once, reconnected in place,
      # and the email it missed brought in (or not, if you choose) — swept by
      # date when Gmail's history no longer reaches back.
      - name: Gmail reconnect
        run: pnpm check:gmail-reauth

      # Customers › select: tag, block and delete many at once, and merge
      # customers that share nothing.
      - name: Customer bulk actions
        run: pnpm check:customer-bulk

      # The website chat when nobody's online: one automatic reply per stretch
      # (asking for an email, or saying we'll use the one we have), never
      # claiming the chat, never emailed on as a reply.
      - name: Website chat away reply
        run: pnpm check:nestchat-away

      # Voice notes an iPhone can play: a browser's WebM/Ogg recording gets an
      # AAC copy, made once with ffmpeg (as in the production image).
      - name: Phone-playable voice notes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          pnpm check:phone-audio

      # Voice notes like WhatsApp's: the speed pill's steps, and Transcribe —
      # made once on the first ask and kept, never from the sender's say-so.
      - name: Voice note speed and Transcribe
        run: pnpm check:transcribe

      # Email signatures: each email channel's design, filled in per sender —
      # a missing position drops its line, and an email signs as the mailbox it
      # really leaves from.
      - name: Email signatures
        run: pnpm check:email-signature

      # Business Ops: the module switch, who reads which SOP (its teams, or all
      # of them; never a draft), versions, must-read confirmations, checklists
      # and review reminders.
      - name: Business Ops
        run: pnpm check:business-ops

      # Team Chat: the module switch, team chats that follow their team, groups
      # only managers and admins create, direct chats, replies, edits, deletes
      # and reactions, ticks from read markers, who's told (mutes, mentions),
      # and admins reading along read-only, with each look recorded.
      - name: Team Chat
        run: pnpm check:team-chat

      # The app surface on a live-chat channel. Two things here are worth a
      # build failing over: the identity secret must never reach a browser (it
      # is what signs "this really is that customer", so anyone holding it can
      # claim to be anyone), and only a conversation field may key a thread — a
      # contact field identifies a person, so keying on one would give every
      # chat that customer opens the same key and merge a year of unrelated
      # conversations into a single thread.
      - name: App surface keys and thread key
        run: pnpm check:app-surface

      # Who an app says its user is. A widget on a public page has nobody to
      # verify; an app knows exactly who is holding the phone, its key sits in a
      # binary anybody can pull apart, and the email it sends is what merges a
      # session onto a customer record we already hold. Believed without proof,
      # that is an impersonation endpoint — so the signature is checked against
      # the user id it claims, under this channel's own secret, in constant
      # time. Accepting any well-formed hash fails four of these.
      - name: App identity and thread resolution
        run: pnpm check:app-identity
      # One chat per order, through the real endpoints: a message goes to the
      # session's own conversation, never just the customer's latest open one.
      # Without that, order B's first message joined order A's chat and then
      # relabelled it as B, and general support shared the same thread.
      - name: App threads per order
        run: pnpm check:app-threads
      - name: Signed-in users on a website
        run: pnpm check:website-identity
      - name: Conversation list filter counts
        run: pnpm check:conversation-counts

      # Files from people who have not signed in to anything, stored by us and
      # served back from our own domain. The allowlist is the point: the
      # question for a type is not whether it is dangerous but whether there is
      # any reason to accept it. SVG is the trap — it passes every "is it an
      # image" test, renders as a picture, and can carry a script, so an agent
      # opening one inline from our origin is stored XSS aimed at them.
      - name: Customer uploads
        run: pnpm check:visitor-uploads

      # Notifying a customer, which is mostly about when not to. The rule under
      # everything else: never push a reply that is already on screen — a
      # message arriving live in an open chat and again as a banner over the top
      # of it is what makes people turn notifications off for good. Also that a
      # dead address is disabled and a flaky one is not, since disabling on a
      # blip at Google's end stops notifying somebody permanently and silently.
      - name: Customer push
        run: pnpm check:customer-push

      # The number on the app icon: unread My Inbound conversations plus unread
      # team chats, kept current by a silent push when something is read.
      - name: App badge
        run: pnpm check:app-badge

      # Reactions: customers' reactions are notified like WhatsApp does, and email
      # reactions go out and come back in Gmail's format.
      - name: Reactions
        run: pnpm check:reactions

      # SMS through any provider's REST API, described by config: each preset's
      # requests, polling and webhooks, replies, receipts, duplicates — with the
      # provider faked at the network seam.
      - name: SMS
        run: pnpm check:sms

      # The Accounts team's SOPs, added once to Swiftee's workspace: published
      # for the Accounts team, no passwords in them, never added twice.
      - name: Accounts SOPs
        run: pnpm check:accounts-sops

      # Filtering an inbox by a custom field — the working set rather than the
      # lookup. Mostly guards one specific way of getting it wrong: an empty set
      # of ids ORed into a query matches everything, so a filter that found
      # nothing renders as the unfiltered inbox. Also that a filter can only
      # ever narrow the view it is applied to, never reach outside it.
      - name: Custom field filtering
        run: pnpm check:field-filter

      # The sidebar's channel order. Its query had no ORDER BY at all, so the
      # list came back in whatever order the heap held — and reshuffled as rows
      # were updated.
      - name: Channel order
        run: pnpm check:channel-order

      # Whether a host app can say which build of the SDK it is running. Both
      # packages sat at 0.1.0 through eight releases, so "have you pulled the
      # latest?" was unanswerable by either side.
      - name: SDK version
        run: pnpm check:sdk-version

      # What the server pushes down a visitor's live stream, checked against the
      # fixture the Dart SDK replays. This shipped wrong and stayed wrong: the
      # SDK read `type`/`message` where the server sends `kind`/`payload`, so
      # every agent reply was dropped before it reached the UI — while the SDK's
      # own test passed, because its fake server had been written from the
      # client's expectation rather than from the server. Two halves agreeing
      # with each other and neither with production is what this catches, and
      # the fixture is owned by neither side so a rename breaks a build.
      - name: Visitor event contract
        run: pnpm check:visitor-events

      # A customer reading their own past conversations — and only their own.
      # Half of this is the feature: a resolved chat was never resumed, so it
      # left the customer's side entirely and everything agreed about their
      # order was readable only by the business. The other half is that the new
      # endpoint takes a conversation id from a stranger on a public surface,
      # and two comparisons against a signed token are all that stand between it
      # and any thread in the database — so the refusals are checked as hard as
      # the reads.
      - name: Visitor history scoping
        run: pnpm check:visitor-history

      # The mandatory two-factor gate. It used to be drawn by the web app and
      # nowhere else, so anything that wasn't the web app was never asked — a
      # password alone was the whole credential. Now the guard holds those
      # sessions away from every route but enrolment, and the allowlist is the
      # dangerous part: too short and the one person who needs to enrol can't,
      # too long and the hole is quietly back for whichever route was added.
      - name: Two-factor enrolment gate
        run: pnpm check:2fa-gate
      - name: Remembered devices at sign-in
        run: pnpm check:trusted-device

      # Hooks called below an early return. React throws #310 and unmounts the
      # whole tree, so the symptom is a white page with nothing in the console
      # that names the component — and it typechecks and builds perfectly. It has
      # shipped twice, most recently blanking the web app the moment you signed in.
      - name: Hook order
        run: pnpm check:hooks

      # Reading a customer list someone exported. Both halves fail silently
      # rather than loudly: a naive CSV split puts half an address in the name
      # field, and a first-match header scan reads "Company Name" as the
      # customer's name and imports everyone under their employer.
      - name: Web unit tests
        run: pnpm --filter @ding/web test

      # Three structural rules about the mobile screens that neither the
      # typechecker nor a browser can see. Takes a second. docs/11-mobile-layout.md
      # says why they exist and why they aren't rendering tests.
      - name: Mobile layout rules
        run: pnpm --filter @ding/mobile check:layout

      # The measurement the third of those rules rests on: on this stack an
      # animated style displaces every other style on its element. If an interop
      # release ever fixes that, this is what says so.
      - name: Mobile native-render tests
        run: pnpm --filter @ding/mobile test

      # The shared client runs in two runtimes and must not guess which. One
      # `typeof document` in here took out every upload on the phone while
      # passing every check, because the checks all run in a browser.
      - name: Shared client runtime sniffing
        run: pnpm --filter @ding/client check:no-sniffing

      # The Flutter SDK's transport half. Pure Dart with no Flutter dependency,
      # so it needs only the Dart SDK — and its tests stand up a real HTTP
      # server speaking the API's shapes rather than a fake client, because a
      # fake would only prove this package calls methods we wrote.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: SDK analyze
        working-directory: sdk/nestconnect_client
        run: dart pub get && dart analyze --fatal-infos

      - name: SDK tests
        working-directory: sdk/nestconnect_client
        run: dart test

      # Flutter web. This is a compile check because the failure it guards
      # against is a compile failure: `dart:io` does not exist in a browser
      # build, so a package that reaches for it does not misbehave on web — it
      # refuses to build, in somebody else's app, at the point they add us.
      # No test run can catch that, which is why this is `compile js` and not
      # another `dart test`.
      - name: SDK builds for the browser
        working-directory: sdk/nestconnect_client
        run: dart compile js -o /tmp/nest-web-probe.js test/web_compile_probe.dart

      # …and that it picked the browser transport rather than quietly falling
      # through to the stub. The io one would have failed the step above, but a
      # stub compiles perfectly and would leave web builds with a package that
      # throws the moment anybody opens the chat.
      - name: SDK web build uses the browser transport
        run: |
          for symbol in EventSource FormData fetch; do
            grep -q "$symbol" /tmp/nest-web-probe.js \
              || { echo "::error::$symbol missing — web build is not using the browser transport"; exit 1; }
          done
          echo "Browser transport present: EventSource, FormData, fetch"

      # The widgets. Flutter rather than Dart, and its own step because the
      # toolchain is a different (much larger) install — worth it: these render
      # the messenger against a real server on loopback, so what is exercised is
      # the path a customer touches rather than a mock agreeing with itself.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter SDK analyze
        working-directory: sdk/nestconnect_flutter
        run: flutter pub get && flutter analyze

      - name: Flutter SDK tests
        working-directory: sdk/nestconnect_flutter
        run: flutter test

      # Typecheck can't see a native-only resolution break (a package Metro
      # resolves differently, a config plugin that won't load). Bundling for one
      # platform does, and takes about half a minute.
      - name: Bundle the mobile app
        run: pnpm --filter @ding/mobile exec expo export --platform ios --output-dir /tmp/mobile-bundle
