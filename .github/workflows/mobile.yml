name: Mobile build

# A native BUILD is deliberately manual: it takes ~15–25 minutes of EAS queue and
# burns a build credit, so it should happen when someone wants an installable app
# — not on every push. Trigger it from the repo's Actions tab (github.com works
# fine from a phone browser); the run's summary links to the build page, where
# the QR code and install link appear.
#
# An UPDATE is not that. It is seconds of work, costs nothing, and reaches phones
# that already have the app — so it runs on every push that touches the JS the
# app actually ships. It was manual only because it shares a workflow with the
# build, and the cost argument for one got applied to the other: what that meant
# in practice is that a mobile fix could be committed, reviewed, deployed to the
# web and reported as done while the phone in someone's hand still ran the old
# code, with nothing anywhere saying so.
#
# Requires one repository secret, EXPO_TOKEN — see docs/08-mobile-builds.md.
on:
  push:
    branches: ["**"]
    paths:
      # What Metro bundles. A change outside these can't alter the app's JS, and
      # publishing an identical update just to say we did adds a row to the
      # updates list that means nothing.
      - "apps/mobile/**"
      - "packages/schemas/**"
      - "packages/client/**"
      - "packages/design/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "build = a new installable app. update = push JS-only changes to apps already installed (seconds, no rebuild). submit = send an existing build to TestFlight / Play, without rebuilding (Android requires an exact build ID)."
        type: choice
        options: [build, update, submit]
        default: build
      platform:
        description: "Which app to build. Ignored for update — an update reaches both."
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "preview = internal install (Android APK). production = store build."
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: "After a production build, submit to TestFlight (iOS) / the selected Play target (Android). Ignored for preview — a store will not take one."
        type: boolean
        default: false
      android_release:
        description: "Play target: internal draft (safe default) or PUBLIC production release. Public requires android + production + submission."
        type: choice
        options: [internal-draft, public-production]
        default: internal-draft
      android_build_id:
        description: "Exact EAS production Android build UUID, required for submit mode (android/all). Never chooses the latest APK."
        type: string
        required: false
      message:
        description: "Note shown against the build/update on expo.dev. Defaults to the commit subject."
        type: string
        required: false

concurrency:
  # One at a time per ref: two builds of the same commit is a wasted credit, and
  # two updates racing onto one channel is a coin flip over which lands last.
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

# A push publishes an update to the preview channel; a dispatch does whatever it
# was asked to. Read once here so every step below agrees on which it is.
env:
  MOBILE_MODE: ${{ github.event_name == 'push' && 'update' || inputs.mode }}
  MOBILE_PROFILE: ${{ github.event_name == 'push' && 'preview' || inputs.profile }}
  # `--auto-submit` only where a store would accept the result. A preview build
  # is an internal-distribution artifact; handing one to App Store Connect fails
  # after the build has already been paid for, which is a confusing place to
  # learn it.
  MOBILE_SUBMIT: ${{ github.event_name != 'push' && inputs.submit && inputs.profile == 'production' }}
  MOBILE_PLATFORM: ${{ inputs.platform }}
  MOBILE_ANDROID_RELEASE: ${{ github.event_name == 'push' && 'internal-draft' || inputs.android_release || 'internal-draft' }}
  MOBILE_ANDROID_BUILD_ID: ${{ inputs.android_build_id }}

jobs:
  mobile:
    runs-on: ubuntu-latest
    env:
      # The lockfile-pinned eas-cli reads this directly; no global CLI install.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Publishing on push is paused until Hermolis has its own app. app.json
      # still names the upstream Expo project and bundle id, so an automatic
      # update would go to someone else's app. Every push still runs the bundle
      # check below; set the repository variable MOBILE_AUTO_UPDATE=true once
      # the Hermolis app exists. A manual run (workflow_dispatch) is a
      # deliberate choice and is not gated.
      MOBILE_PUBLISH: ${{ github.event_name != 'push' || vars.MOBILE_AUTO_UPDATE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads it from "packageManager" in
      # package.json, and pinning it in both places aborts the action
      # (ERR_PNPM_BAD_PM_VERSION). Same as ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release selection
        id: release
        run: node tools/mobile-release.mjs validate

      # eas is resolved by pnpm exec from the repository lockfile, not latest.
      # Installed from the ROOT: apps/mobile depends on @ding/client and
      # @ding/schemas, and node-linker=hoisted puts their files in the root
      # node_modules rather than under apps/mobile.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Catches a resolution break before spending 20 minutes of EAS queue on it.
      # Metro resolves differently from tsc, so a typecheck alone wouldn't.
      - name: Bundle check
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --output-dir /tmp/mobile-bundle

      # `head_commit` only exists on push events, so read the subject from git.
      - name: Resolve the message
        id: msg
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          MSG="$INPUT_MESSAGE"
          [ -n "$MSG" ] || MSG="$(git log -1 --pretty=%s)"
          MSG="${MSG//$'\n'/ }"
          MSG="${MSG//$'\r'/ }"
          echo "text=$MSG" >> "$GITHUB_OUTPUT"

      - name: Build
        if: env.MOBILE_MODE == 'build'
        working-directory: apps/mobile
        # No `--no-wait`, deliberately, and it used to be there. The argument for
        # it was that the runner shouldn't idle through the queue for a progress
        # bar the build page already shows — which assumed someone is watching
        # that page. Nobody is. What actually happened is that EAS accepted a job,
        # failed it twenty minutes later, and this workflow stayed green: a run
        # that reports success whether or not an app exists at the end of it is
        # worse than no signal, because it's a signal people believe. Waiting
        # costs runner minutes and turns a failed build red, which is the whole
        # reason to have this.
        #
        # The build page URL is printed near the start of the command's output,
        # so it's available in the log long before the run finishes.
        timeout-minutes: 60
        env:
          BUILD_MESSAGE: ${{ steps.msg.outputs.text }}
          SUBMIT_PROFILE: ${{ steps.release.outputs.submit_profile }}
        run: |
          # --auto-submit hands the finished binary to the store in the same run.
          # Splitting them meant a 25-minute build followed by a trip to a
          # terminal, and the trip is what did not happen.
          SUBMIT=()
          [ "$MOBILE_SUBMIT" = "true" ] && SUBMIT=(--auto-submit-with-profile "$SUBMIT_PROFILE")
          pnpm exec eas build \
            --platform "$MOBILE_PLATFORM" \
            --profile "$MOBILE_PROFILE" \
            --message "$BUILD_MESSAGE" \
            "${SUBMIT[@]}" \
            --non-interactive

      # For the case the build survived and the upload didn't — a wrong secret,
      # an App Store Connect hiccup. Re-submitting the binary that already exists
      # beats spending another 25 minutes making an identical one.
      - name: Submit Android
        if: env.MOBILE_MODE == 'submit' && inputs.platform != 'ios'
        working-directory: apps/mobile
        timeout-minutes: 30
        run: node ../../tools/mobile-release.mjs submit-android

      # Keep the existing TestFlight latest-build behavior; only Android needs
      # the explicit build ID. Public Android releases cannot select all/ios.
      - name: Submit iOS
        if: env.MOBILE_MODE == 'submit' && inputs.platform != 'android'
        working-directory: apps/mobile
        timeout-minutes: 30
        run: |
          pnpm exec eas submit \
            --platform ios \
            --profile "$MOBILE_PROFILE" \
            --latest \
            --non-interactive

      - name: Update
        if: env.MOBILE_MODE == 'update' && env.MOBILE_PUBLISH == 'true'
        working-directory: apps/mobile
        env:
          UPDATE_MESSAGE: ${{ steps.msg.outputs.text }}
        run: |
          # The channel matches the build profile's `channel` in eas.json, so an
          # update published here reaches the builds made with that profile.
          pnpm exec eas update \
            --channel ${{ env.MOBILE_PROFILE }} \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      - name: Publishing paused
        if: env.MOBILE_PUBLISH != 'true'
        run: |
          {
            echo "### Mobile update not published"
            echo
            echo "The app bundles cleanly. Publishing on push is paused until the"
            echo "Hermolis app is set up — set the repository variable"
            echo "MOBILE_AUTO_UPDATE=true to turn it back on."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Where to find it
        if: env.MOBILE_PUBLISH == 'true'
        run: |
          case "${{ env.MOBILE_MODE }}" in
            build) KIND=builds ;;
            submit) KIND=submissions ;;
            *) KIND=updates ;;
          esac
          {
            echo "### Mobile ${{ env.MOBILE_MODE }} started"
            echo
            echo "Watch it — and get the install link / QR code — at:"
            echo
            echo "<https://expo.dev/accounts/swiftee/projects/nest-connect/$KIND>"
            echo
            if [ "${{ env.MOBILE_SUBMIT }}" = "true" ] || [ "$KIND" = "submissions" ]; then
              if [ "$MOBILE_PLATFORM" != "ios" ]; then
                echo "Android Play target: $MOBILE_ANDROID_RELEASE."
                echo "Public production submissions request a completed release and review."
                echo "Play declarations, permissions, review and managed publishing can still block availability."
                echo "This summary is not evidence that the app is public. Check Play Console."
              fi
              if [ "$MOBILE_PLATFORM" != "android" ]; then
                echo "iOS goes to App Store Connect / TestFlight, not a public App Store release."
              fi
              echo
            fi
            if [ "$KIND" = "updates" ]; then
              echo "It reaches an installed app the next time that app is opened."
              echo "A native build only picks up updates published for its own"
              echo "runtime version, so if this one doesn't appear, the app in"
              echo "your hand needs rebuilding rather than updating."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
